<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nueva contraseña — Trazia</title>
<meta name="description" content="Crea una contraseña nueva para tu cuenta de Trazia.">
<meta name="theme-color" content="#FAF7F0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Manrope:wght@500..800&family=Nunito:wght@800&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
</head>
<body>
<div class="auth-layout">
  <aside class="auth-aside">
    <span class="trace-motif" aria-hidden="true"></span>
    <a href="index.html" aria-label="Trazia, inicio">
      <span class="brand brand--light">
        <svg class="brand__symbol" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M12 28.5 29 11.5" fill="none" stroke="#8FA4F0" stroke-width="9" stroke-linecap="round"/>
          <path d="M21 34.5 30 25.5" fill="none" stroke="#A99BE8" stroke-width="9" stroke-linecap="round"/>
          <circle cx="34.5" cy="35" r="4.2" fill="#F47F68"/>
        </svg>
        <span class="brand__word"><span class="visually-hidden">trazia</span><span aria-hidden="true">traz<span class="brand__i">ı<i class="brand__tittle"></i></span>a</span></span>
      </span>
    </a>
    <div>
      <p class="auth-aside__title">Una contraseña nueva y seguimos.</p>
      <p class="auth-aside__text">Elige una que no uses en ningún otro sitio.</p>
    </div>
    <p class="auth-aside__foot">Traza tu día.</p>
  </aside>

  <main class="auth-main">
    <div class="auth-main__top">
      <a href="index.html" aria-label="Trazia, inicio">
        <span class="brand">
          <svg class="brand__symbol brand__symbol--sm" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M12 28.5 29 11.5" fill="none" stroke="#4056B5" stroke-width="9" stroke-linecap="round"/>
            <path d="M21 34.5 30 25.5" fill="none" stroke="#A99BE8" stroke-width="9" stroke-linecap="round"/>
            <circle cx="34.5" cy="35" r="4.2" fill="#F47F68"/>
          </svg>
          <span class="brand__word"><span class="visually-hidden">trazia</span><span aria-hidden="true">traz<span class="brand__i">ı<i class="brand__tittle"></i></span>a</span></span>
        </span>
      </a>
      <a class="link-btn" href="auth.html?modo=login">Iniciar sesión</a>
    </div>
    <div class="auth-card" id="reset-card">
      <div class="loading-screen">
        <svg class="brand__symbol" viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
          <path d="M12 28.5 29 11.5" fill="none" stroke="#4056B5" stroke-width="9" stroke-linecap="round"/>
          <path d="M21 34.5 30 25.5" fill="none" stroke="#A99BE8" stroke-width="9" stroke-linecap="round"/>
          <circle cx="34.5" cy="35" r="4.2" fill="#F47F68"/>
        </svg>
        <p class="muted small">Comprobando el enlace</p>
      </div>
    </div>
  </main>
</div>
<script type="module" src="js/reset.js"></script>
</body>
</html>
